# Sinapse XD — Render infrastructure blueprint
# Scope: standalone intelligence dashboard (6 external pillars, no CRM services)
services:
  # ── Next.js web app ────────────────────────────────────
  - type: web
    name: sinapse-xd-web
    runtime: node
    # Render's Node image ships with corepack/pnpm already enabled at a
    # read-only system path; calling `corepack enable` ourselves tries to
    # rewrite that shim and fails with EROFS. pnpm alone is enough — the
    # existing shim still honours package.json's pinned "packageManager".
    buildCommand: pnpm install && pnpm build --filter=web
    startCommand: pnpm --filter=web start
    envVars:
      - fromGroup: sinapse-xd-env
    autoDeploy: true

  # ── Silver consumer — drains queues → Postgres (Silver) ─
  - type: worker
    name: sinapse-silver-consumer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m consumers.silver_consumer
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── AIS ingestor — real-time background worker ──────────
  - type: worker
    name: sinapse-pipeline-ais
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.ais_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── Trade data ingestor — daily cron ────────────────────
  - type: cron
    name: sinapse-cron-trade
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.trade_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── Port activity (IMF PortWatch) — daily cron ──────────
  - type: cron
    name: sinapse-cron-port-activity
    runtime: python
    schedule: "30 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.port_activity_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── Weather ingestor — hourly cron ──────────────────────
  - type: cron
    name: sinapse-cron-weather
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.weather_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── Freight rate ingestor — 4-hourly cron ───────────────
  - type: cron
    name: sinapse-cron-freight
    runtime: python
    schedule: "0 */4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.market_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── Financial data ingestor — daily cron ────────────────
  - type: cron
    name: sinapse-cron-financial
    runtime: python
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.financial_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env

  # ── SDG indicator ingestor — weekly cron ────────────────
  - type: cron
    name: sinapse-cron-sdg
    runtime: python
    schedule: "0 3 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingestors.sdg_ingestor
    rootDir: packages/pipeline
    envVars:
      - fromGroup: sinapse-xd-env
