# Sinapse XD — Render infrastructure blueprint
# Scope: standalone intelligence dashboard (6 external pillars, no CRM services)
services:
  # ── Next.js web app ────────────────────────────────────
  - type: web
    name: sinapse-xd-web
    runtime: node
    buildCommand: corepack enable && pnpm install && pnpm build --filter=web
    startCommand: pnpm --filter=web start
    envVarGroups:
      - sinapse-xd-env
    autoDeploy: true

  # ── AIS ingestor — real-time background worker ──────────
  - type: worker
    name: sinapse-pipeline-ais
    runtime: python
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.ais_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env

  # ── Trade data ingestor — daily cron ────────────────────
  - type: cron
    name: sinapse-cron-trade
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.trade_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env

  # ── Weather ingestor — hourly cron ──────────────────────
  - type: cron
    name: sinapse-cron-weather
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.weather_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env

  # ── Freight rate ingestor — 4-hourly cron ───────────────
  - type: cron
    name: sinapse-cron-freight
    runtime: python
    schedule: "0 */4 * * *"
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.market_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env

  # ── Financial data ingestor — daily cron ────────────────
  - type: cron
    name: sinapse-cron-financial
    runtime: python
    schedule: "0 5 * * *"
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.financial_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env

  # ── SDG indicator ingestor — weekly cron ────────────────
  - type: cron
    name: sinapse-cron-sdg
    runtime: python
    schedule: "0 3 * * 1"
    buildCommand: pip install -r packages/pipeline/requirements.txt
    startCommand: python -m ingestors.sdg_ingestor
    rootDir: packages/pipeline
    envVarGroups:
      - sinapse-xd-env
